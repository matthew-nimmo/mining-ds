{{ define "main" }}
<section style="padding: 80px 0 40px 0;">
  <h1>Repositories</h1>
</section>

<section>
  <div class="tag-grid">
    {{ range .Data.Terms }}
      <a href="{{ printf "%s?repo=%s" ("posts/" | relURL) (.Page.Title | urlquery) }}" class="tag-link">
        {{ .Page.Title }}
      </a>
    {{ end }}
  </div>
</section>
{{ end }}
